name: DigUpIOS
options:
  bundleIdPrefix: com.abdurrahim
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

packages:
  DigUp:
    path: ..

targets:
  DigUpIOS:
    type: application
    platform: iOS
    sources:
      - path: DigUpIOS
        excludes:
          - Info.plist
      # LlamaRuntime is compiled into the app rather than being a package target: it imports CLlama, whose static library
      # lives outside SwiftPM (scripts/build-llama-ios.sh). The package itself carries only DigUpKit.
      - path: ../Sources/LlamaRuntime
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.abdurrahim.DigUp
        PRODUCT_NAME: DigUp
        INFOPLIST_FILE: DigUpIOS/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        SWIFT_VERSION: "5.0"
        SWIFT_STRICT_CONCURRENCY: minimal
        IPHONEOS_DEPLOYMENT_TARGET: "17.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_STYLE: Automatic
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        OTHER_LDFLAGS: "$(inherited) -lc++"
        # CLlamaIOS/module.modulemap describes the iOS build of llama.cpp (scripts/build-llama-ios.sh).
        SWIFT_INCLUDE_PATHS: "$(SRCROOT)/CLlamaIOS"
        HEADER_SEARCH_PATHS: "$(SRCROOT)/../Vendor/llama-ios/include"
        LIBRARY_SEARCH_PATHS: "$(SRCROOT)/../Vendor/llama-ios/lib"
    dependencies:
      - package: DigUp
        product: DigUpKit
      - sdk: Photos.framework
      - sdk: QuickLook.framework
    preBuildScripts:
      - name: Check the iOS llama.cpp build
        basedOnDependencyAnalysis: false
        script: |
          set -e
          if [ ! -f "$SRCROOT/../Vendor/llama-ios/lib/libllamacpp.a" ]; then
            echo "error: Vendor/llama-ios/lib/libllamacpp.a is missing. Run scripts/build-llama-ios.sh first." >&2
            exit 1
          fi
